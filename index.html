<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altuva — Metabolisches Berberin-Pflaster</title>
    <meta name="description" content="Altuva-Pflaster mit Berberin und Pflanzenextrakten unterstützen Ihren Stoffwechsel rund um die Uhr." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="rating-row">
          <span class="stars">★★★★★</span>
          <span>Bewertet mit <strong>4,8</strong> / 5 von <strong>5.000+</strong> zufriedenen Kunden</span>
        </div>
        <div class="shipping-row">
          <span>🚚 KOSTENLOSE &amp; SCHNELLE LIEFERUNG</span>
          <span>📍 5.000+ ZUFRIEDENE KUNDEN</span>
        </div>
      </header>
      <div class="main-header">
        <div class="logo">Altuva</div>
        <div class="step-counter" id="step-counter">1/11</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <main class="quiz-content" id="quiz-content"></main>
      <section class="trust-section" id="trust-section">
        <p class="privacy-note">🛡️ Ihre Angaben sind bei uns sicher und vertraulich.</p>
        <div class="trust-badges"><span>🛡️ SSL Sicher</span><span>✅ Geprüft</span><span>🔒 Datenschutz</span></div>
      </section>
      <aside class="testimonial" id="testimonial"></aside>
    </div>
    <div id="results-page" class="results-page hidden"></div>
    <script src="app.js"></script>
  </body>
</html>
